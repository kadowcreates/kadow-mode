name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check-skills.py
      - run: for f in skills/platform-audit/*.py; do python $f --self-test; done
      # Installs update only when plugin.json's version changes, so a skill change without a bump never ships.
      - name: version bumped when skills change
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          git diff --quiet "$base"...HEAD -- skills .claude-plugin && exit 0
          old=$(git show "$base:.claude-plugin/plugin.json" | jq -r .version)
          new=$(jq -r .version .claude-plugin/plugin.json)
          [ "$old" != "$new" ] || { echo "::error::skills changed; bump version in .claude-plugin/plugin.json (now $old)"; exit 1; }
